<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>表格性能自动化测试报告</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f6fa;
    color: #333;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 12px; border-left: 4px solid #5b8ff9; padding-left: 8px; }
  .meta { color: #888; font-size: 13px; line-height: 1.8; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }
  /* ---- 雷达图区 ---- */
  .radar-wrap { display: flex; gap: 16px; align-items: stretch; flex-wrap: wrap; }
  #radar { flex: 1; min-width: 420px; height: 440px; }
  .radar-side { width: 260px; display: flex; flex-direction: column; }
  .radar-current {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 4px;
    transition: color 0.3s;
  }
  .radar-hint { font-size: 12px; color: #aaa; margin-bottom: 12px; }
  .pause-badge {
    visibility: hidden;
    font-size: 12px;
    color: #d46b08;
    background: #fff7e6;
    border: 1px solid #ffd591;
    border-radius: 4px;
    padding: 2px 8px;
    margin-bottom: 10px;
    width: fit-content;
  }
  #legend { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    font-size: 13px;
    transition: background 0.2s;
  }
  .legend-item:hover { background: #f0f5ff; }
  .legend-item.active { border-color: currentColor; background: #f0f5ff; font-weight: bold; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .progress {
    height: 3px;
    background: #e8e8e8;
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progress-bar { height: 100%; width: 0; background: #5b8ff9; }
  /* ---- 表格 ---- */
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #eee; padding: 7px 10px; text-align: right; white-space: nowrap; }
  th { background: #fafafa; font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  td.best { color: #389e0d; font-weight: bold; background: #f6ffed; }
  td.worst { color: #cf1322; background: #fff1f0; }
  .table-scroll { overflow-x: auto; }
  /* ---- 条形图网格 ---- */
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 16px;
  }
  .chart-box { height: 360px; }
  .note { font-size: 12px; color: #999; line-height: 1.9; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>表格性能自动化测试报告</h1>
  <div class="meta" id="meta"></div>

  <h2>综合评分雷达图</h2>
  <div class="card radar-wrap">
    <div id="radar"></div>
    <div class="radar-side">
      <div class="radar-current" id="radarTitle">-</div>
      <div class="radar-hint">每 2s 自动切换，鼠标悬浮左侧图例可暂停</div>
      <div class="pause-badge" id="pauseBadge">⏸ 已暂停（移开鼠标恢复）</div>
      <div id="legend"></div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>

  <h2>指标明细</h2>
  <div class="card table-scroll">
    <table id="dataTable"></table>
    <div class="note">
      绿色 = 该列最优，红色 = 该列最差。渲染耗时 = 点击 Tab → DOM 稳定（含异步 chunk 加载）；
      掉帧数 = 帧耗时 &gt; 33.4ms 的帧数量；scroll = 程序化 scrollTop 驱动，wheel = 合成滚轮事件（canvas 类表格）；
      实际滚动(px) 为会话中达到的最大 scrollTop，wheel 方式记为 -1。
    </div>
  </div>

  <h2>各维度对比</h2>
  <div class="chart-grid" id="chartGrid"></div>
  <div class="note" style="margin-top:14px">条形图按优劣排序，最好的排最上面（★ 为该维度最优）。</div>
</div>

<script>
  /* global echarts */
  // __DATA__ / __META__ 为占位符，由 run-perf.mjs 生成报告时替换为真实数据
  var DATA = __DATA__; // eslint-disable-line
  var META = __META__; // eslint-disable-line

  var COLORS = [
    '#5b8ff9', '#5ad8a6', '#f6bd16', '#e86452', '#6dc8ec',
    '#945fb9', '#ff9845', '#1e9493', '#ff99c3', '#749ef1',
  ];
  var names = DATA.map(function (d) { return d.table; });
  function colorOf(i) { return COLORS[i % COLORS.length]; }

  // ---------------- 元信息 ----------------
  document.getElementById('meta').innerHTML =
    '时间：' + META.time +
    '　|　环境：headless chromium, viewport 1600x1000, 生产构建' +
    '　|　数据：1000 行 × 20 列，滚动会话 ' + META.scrollDuration + 'ms（先到底再回顶）';

  // ---------------- 雷达图 ----------------
  var DIMS = [
    { key: 'renderMs', name: '渲染速度', lower: true },
    { key: 'avgFps', name: '平均FPS', lower: false },
    { key: 'lowFps1pct', name: '1%low FPS', lower: false },
    { key: 'p99FrameMs', name: '帧稳定性', lower: true },
    { key: 'droppedFrames', name: '掉帧控制', lower: true },
    { key: 'scrollLongTaskMs', name: '滚动流畅', lower: true },
  ];

  // 各维度归一化得分（10~100，越高越好）
  var scoreTable = DATA.map(function () { return []; });
  DIMS.forEach(function (dim, di) {
    var vals = DATA.map(function (d) { return Number(d[dim.key]) || 0; });
    var min = Math.min.apply(null, vals);
    var max = Math.max.apply(null, vals);
    vals.forEach(function (v, i) {
      var t = max === min ? 1 : (v - min) / (max - min);
      scoreTable[i][di] = Math.round(((dim.lower ? 1 - t : t) * 90 + 10) * 10) / 10;
    });
  });

  var radarChart = echarts.init(document.getElementById('radar'));
  radarChart.setOption({
    tooltip: {},
    radar: {
      indicator: DIMS.map(function (d) { return { name: d.name, max: 100 }; }),
      radius: '68%',
      splitArea: { areaStyle: { opacity: 0.3 } },
    },
    series: [{ type: 'radar', data: [] }],
  });

  var curIdx = 0;
  var paused = false;
  var legendEl = document.getElementById('legend');
  var chips = [];

  names.forEach(function (name, i) {
    var item = document.createElement('div');
    item.className = 'legend-item';
    item.style.color = colorOf(i);
    var dot = document.createElement('span');
    dot.className = 'legend-dot';
    dot.style.background = colorOf(i);
    var label = document.createElement('span');
    label.style.color = '#333';
    label.textContent = name;
    item.appendChild(dot);
    item.appendChild(label);
    item.addEventListener('mouseenter', function () {
      paused = true;
      document.getElementById('pauseBadge').style.visibility = 'visible';
      showRadar(i);
    });
    item.addEventListener('mouseleave', function () {
      paused = false;
      document.getElementById('pauseBadge').style.visibility = 'hidden';
    });
    item.addEventListener('click', function () { showRadar(i); });
    legendEl.appendChild(item);
    chips.push(item);
  });

  function showRadar(i) {
    curIdx = i;
    var c = colorOf(i);
    radarChart.setOption({
      series: [
        {
          type: 'radar',
          data: [{ value: scoreTable[i], name: names[i] }],
          lineStyle: { color: c, width: 2 },
          itemStyle: { color: c },
          areaStyle: { color: c, opacity: 0.25 },
        },
      ],
    });
    var title = document.getElementById('radarTitle');
    title.textContent = names[i];
    title.style.color = c;
    chips.forEach(function (chip, j) { chip.classList.toggle('active', j === i); });
    startProgress();
  }

  // 自动切换 + 进度条
  var INTERVAL = 2000;
  var progressEl = document.getElementById('progressBar');
  var progressStart = Date.now();
  function startProgress() { progressStart = Date.now(); }
  setInterval(function () {
    if (!paused) {
      showRadar((curIdx + 1) % names.length);
    }
  }, INTERVAL);
  setInterval(function () {
    var p = paused ? 1 : Math.min(1, (Date.now() - progressStart) / INTERVAL);
    progressEl.style.width = p * 100 + '%';
    progressEl.style.background = colorOf(curIdx);
  }, 50);
  showRadar(0);

  // ---------------- 明细表 ----------------
  var TABLE_COLS = [
    { key: 'table', name: '表格' },
    { key: 'renderMs', name: '渲染耗时(ms)', lower: true },
    { key: 'firstPaintMs', name: '首次出现(ms)', lower: true },
    { key: 'renderLongTaskMs', name: '渲染长任务(ms)', lower: true },
    { key: 'scrollMethod', name: '滚动方式' },
    { key: 'scrolledPx', name: '实际滚动(px)' },
    { key: 'avgFps', name: '平均FPS', lower: false },
    { key: 'lowFps1pct', name: '1%low FPS', lower: false },
    { key: 'p99FrameMs', name: 'p99帧(ms)', lower: true },
    { key: 'worstFrameMs', name: '最差帧(ms)', lower: true },
    { key: 'droppedFrames', name: '掉帧数', lower: true },
    { key: 'scrollLongTaskMs', name: '滚动长任务(ms)', lower: true },
    { key: 'heapDeltaMB', name: '堆增量(MB)' },
  ];
  var tableEl = document.getElementById('dataTable');
  // 每列最优/最差（需在生成行之前计算）
  var bestIdx = {};
  var worstIdx = {};
  TABLE_COLS.forEach(function (c) {
    if (typeof c.lower !== 'boolean') return;
    var vals = DATA.map(function (d) { return Number(d[c.key]) || 0; });
    var best = c.lower ? Math.min.apply(null, vals) : Math.max.apply(null, vals);
    var worst = c.lower ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
    bestIdx[c.key] = vals.indexOf(best);
    worstIdx[c.key] = vals.indexOf(worst);
  });
  var thead = '<tr>' + TABLE_COLS.map(function (c) { return '<th>' + c.name + '</th>'; }).join('') + '</tr>';
  var tbody = DATA.map(function (row, i) {
    return '<tr>' + TABLE_COLS.map(function (c) {
      var v = row[c.key];
      var cls = '';
      if (typeof c.lower === 'boolean' && bestIdx[c.key] === i) cls = 'best';
      if (typeof c.lower === 'boolean' && worstIdx[c.key] === i) cls = 'worst';
      return '<td class="' + cls + '">' + v + '</td>';
    }).join('') + '</tr>';
  }).join('');
  tableEl.innerHTML = thead + tbody;

  // ---------------- 各维度柱状图 ----------------
  var CHARTS = [
    { key: 'renderMs', name: '渲染耗时', unit: 'ms', lower: true },
    { key: 'firstPaintMs', name: '首次出现', unit: 'ms', lower: true },
    { key: 'renderLongTaskMs', name: '渲染长任务阻塞', unit: 'ms', lower: true },
    { key: 'avgFps', name: '滚动平均 FPS', unit: 'fps', lower: false },
    { key: 'lowFps1pct', name: '1% low FPS', unit: 'fps', lower: false },
    { key: 'p99FrameMs', name: 'p99 帧耗时', unit: 'ms', lower: true },
    { key: 'worstFrameMs', name: '最差帧耗时', unit: 'ms', lower: true },
    { key: 'droppedFrames', name: '掉帧数', unit: '帧', lower: true },
    { key: 'scrollLongTaskMs', name: '滚动长任务阻塞', unit: 'ms', lower: true },
    { key: 'heapDeltaMB', name: '堆内存增量', unit: 'MB' },
  ];
  var gridEl = document.getElementById('chartGrid');
  CHARTS.forEach(function (cfg) {
    var box = document.createElement('div');
    box.className = 'card';
    var inner = document.createElement('div');
    inner.className = 'chart-box';
    box.appendChild(inner);
    gridEl.appendChild(box);

    var allVals = DATA.map(function (d) { return Number(d[cfg.key]) || 0; });
    var best = cfg.lower === true ? Math.min.apply(null, allVals)
      : cfg.lower === false ? Math.max.apply(null, allVals) : null;

    // 按优劣排序：最好的排最上面；无方向指标保持原始顺序
    var rows = DATA.map(function (d, i) {
      return { name: d.table, val: Number(d[cfg.key]) || 0, ci: i };
    });
    if (cfg.lower === true) rows.sort(function (a, b) { return a.val - b.val; });
    else if (cfg.lower === false) rows.sort(function (a, b) { return b.val - a.val; });

    var chart = echarts.init(inner);
    chart.setOption({
      title: {
        text: cfg.name + (cfg.lower === true ? '（越低越好）' : cfg.lower === false ? '（越高越好）' : ''),
        textStyle: { fontSize: 14 },
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        valueFormatter: function (v) { return v + ' ' + cfg.unit; },
      },
      grid: { left: 118, right: 56, bottom: 34, top: 44 },
      xAxis: { type: 'value', name: cfg.unit },
      yAxis: {
        type: 'category',
        data: rows.map(function (r) { return r.name; }),
        inverse: true, // 第一个类目（最优）置顶
        axisLabel: { fontSize: 12 },
      },
      series: [
        {
          type: 'bar',
          data: rows.map(function (r) {
            return {
              value: r.val,
              itemStyle: {
                color: colorOf(r.ci),
                opacity: best !== null && r.val === best ? 1 : 0.75,
                borderRadius: [0, 3, 3, 0],
              },
            };
          }),
          label: {
            show: true,
            position: 'right',
            fontSize: 11,
            formatter: function (p) {
              return p.value + (best !== null && p.value === best ? ' ★' : '');
            },
          },
          barMaxWidth: 22,
        },
      ],
    });
    window.addEventListener('resize', function () { chart.resize(); });
  });
  window.addEventListener('resize', function () { radarChart.resize(); });
</script>
</body>
</html>
