# 构建应用并发布到 GitHub Pages（站点根 = 应用首页 index.html，另附性能报告 perf-report.html）
# 触发方式：
#   1. push 到 master / main（源码或报告变更自动重新构建发布）
#   2. Actions 页面手动触发 workflow_dispatch
name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare publish directory
        run: |
          mkdir -p public-report
          cp -r dist/* public-report/
          cp perf/perf-report.html public-report/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # upload-pages-artifact@v3 的 path 必须是目录，不支持单文件
          path: public-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
